name: "🐛 Bug Report"
description: "File a reproducible bug report for [PROJECT_NAME]"
title: "fix: [Short summary of the issue]"
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug in **[PROJECT_NAME]**!

  - type: input
    id: environment
    attributes:
      label: "Environment & Versions"
      description: "OS, Node / Go / runtime version, and dependencies."
      placeholder: "e.g., Windows 11, Node 20.10.0, pnpm 9.1.0"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: "Describe the Bug"
      description: "A clear and concise description of what the bug is."
      placeholder: "When running ..., the system..."
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: "Steps to Reproduce"
      description: "Exact steps to reproduce the behavior."
      placeholder: |
        1. Run '...'
        2. Inspect output...
        3. See error...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: "Expected Behavior"
      description: "What you expected to happen."
      placeholder: "The process should complete without error..."
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: "Relevant Logs & Output"
      description: "Paste relevant command output or stack traces."
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: "Pre-Submission Checklist"
      options:
        - label: "I have searched existing issues to ensure this is not a duplicate."
          required: true
